schema_version: 1
config_version: 1
id: staged_valid
kind: staged_research
result_stage: referee
input:
  code:
    type: string
    pattern: "^[0-9]{6}$"
dossier:
  section_chars: 1800
  dossier_summary_chars: 6000
  sections:
    - id: quote
      tool: query_quote
      args:
        codes: ["${input.code}"]
      empty_policy: gap_if_empty
stages:
  - id: bull
    label: 多方研究员
    skill: builtin/debate
    instruction: references/bull.md
    context: [dossier]
    on_error: continue
    output_chars: 1200
    context_chars: 24000
  - id: bear
    label: 空方研究员
    skill: builtin/debate
    instruction: references/bear.md
    context: [dossier, stage.bull]
    on_error: continue
    output_chars: 1200
    context_chars: 24000
  - id: referee
    label: 中立主持
    skill: builtin/debate
    instruction: references/referee.md
    context: [dossier.summary, dossier.missing, stages]
    on_error: fail
    output_chars: 1200
    context_chars: 24000
variants:
  standard:
    - bull
    - bear
    - referee
